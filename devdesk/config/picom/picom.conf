# devdesk · picom (full effects — used on AC power)
backend = "glx";
vsync = true;
unredir-if-possible = true;      # fullscreen apps bypass the compositor

corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [ "window_type = 'dock'", "class_g = 'Rofi'", "_GTK_FRAME_EXTENTS@:c" ];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [ "window_type = 'dock'", "_GTK_FRAME_EXTENTS@:c" ];

inactive-opacity = 0.95;
frame-opacity = 1.0;
opacity-rule = [
  "100:fullscreen",
  "92:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused"
];
