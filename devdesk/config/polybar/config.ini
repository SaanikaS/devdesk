; devdesk · polybar — colours come from pywal through Xresources

[colors]
background = ${xrdb:background:#1e1e2e}
foreground = ${xrdb:foreground:#cdd6f4}
primary    = ${xrdb:color4:#89b4fa}
secondary  = ${xrdb:color5:#cba6f7}
alert      = ${xrdb:color1:#f38ba8}
muted      = ${xrdb:color8:#6c7086}

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-left = 0
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
modules-left = i3
modules-center = xwindow
modules-right = sysstat pulseaudio date
tray-position = right
tray-padding = 4
tray-background = ${colors.background}
enable-ipc = true
cursor-click = pointer

[bar/secondary]
inherit = bar/main
tray-position = none

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.muted}

; Custom refreshable script: auto-updates every 5 s, click to refresh instantly.
[module/sysstat]
type = custom/script
exec = ~/.local/bin/sysstat --watch 5
tail = true
click-left = ~/.local/bin/sysstat --refresh
label = %output%
label-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = VOL <label-volume>
format-volume-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}
